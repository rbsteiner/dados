version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: hijacked releases are usually pulled by then.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: hijacked releases are usually pulled by then.
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: hijacked releases are usually pulled by then.
    cooldown:
      default-days: 7
    # Node majors are chosen by hand so we stay on LTS releases (even numbers).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
