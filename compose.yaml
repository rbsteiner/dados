services:
  app:
    build: .
    volumes:
      - .:/app
      # node_modules lives only in the container, never on the host.
      - node_modules:/app/node_modules
      # Tools in the container must not be able to plant git hooks that later run on the host.
      - ./.git:/app/.git:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      # Reachable from this Mac only. To test from a phone on a trusted network:
      #   DEV_HOST=0.0.0.0 docker compose up
      - "${DEV_HOST:-127.0.0.1}:5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
